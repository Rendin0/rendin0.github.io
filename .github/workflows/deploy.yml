name: Deploy Hugo

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Decrypt posts
        run: |
          mkdir -p content/posts
          # enc/ mirrors the content/posts tree (page bundles: markdown plus
          # images), so restore directories, not just top-level files.
          while IFS= read -r -d '' enc; do
            rel=${enc#enc/}
            out="content/posts/${rel%.enc}"
            mkdir -p "$(dirname "$out")"
            openssl enc -d -aes-256-cbc -pbkdf2 -pass pass:"$MASTER_KEY" \
              -in "$enc" -out "$out"
          done < <(find enc -type f -name '*.enc' -print0)
        env:
          MASTER_KEY: ${{ secrets.MASTER_KEY }}

      - run: hugo --minify

      - name: Encrypt locked fragments
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in secrets.json.enc -out /tmp/secrets.json -pass pass:"$MASTER_KEY"
          npm install cheerio --no-save
          node scripts/encrypt-fragments.mjs
          rm -f /tmp/secrets.json
          rm -rf content/posts
        env:
          MASTER_KEY: ${{ secrets.MASTER_KEY }}

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true